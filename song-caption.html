<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Songs that remind Bittu of Kush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yatra+One&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0b0b;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui;
  }

  .frame {
    position: relative;
    max-width: 1000px;
    width: 100%;
  }

  .frame img {
    display: block;
    width: 100%;
    height: auto;
  }

  .caption {
    position: absolute;
    top: 5%;
    left: 0;
    right: 0;
    text-align: center;
    padding: 0 5%;
  }

  .caption span {
    font-family: "Yatra One", system-ui;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(1rem, 3.2vw, 2.1rem);
    color: #fdf6ec;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.6);
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="frame">
    <img src="street-scene.png" alt="Couple embracing on a street at golden hour">
    <div class="caption">
      <span>सोंग्स दैट रिमाइंड बिट्टू ऑफ़ कुस</span>
    </div>
  </div>
</body>
</html>
